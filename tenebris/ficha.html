<!-- ===== FICHA ===== -->
<section id="page-ficha" class="content-page" style="display:none;">
    <!-- HEADER (adicionar no início) -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-logo" onclick="navegarPara('home')">
                <span class="logo-icon">⚔️</span>
                <span>TENEBRIS</span>
            </div>
            
            <nav class="main-nav">
                <a class="nav-link" data-page="home" onclick="navegarPara('home')">🏠 Início</a>
                <a class="nav-link active" data-page="ficha" onclick="navegarPara('ficha')">📋 Ficha</a>
                <a class="nav-link" data-page="loja" onclick="navegarPara('loja')">🛒 Loja</a>
                <a class="nav-link" data-page="comunidade" onclick="navegarPara('comunidade')">💬 Comunidade</a>
            </nav>
            
            <div class="header-user">
                <span class="user-avatar">👤</span>
                <span id="headerUserDisplay">Admin</span>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO DA FICHA -->
    <div class="main-content">
        <div class="ficha-wrapper">
            <div class="ficha-header">
                <h2>📋 Ficha de Personagem</h2>
                <div class="ficha-actions">
                    <button class="btn-sec" onclick="salvarFicha()">💾 Salvar</button>
                    <button class="btn-sec" onclick="carregarFicha()">📂 Carregar</button>
                    <button class="btn-sec" onclick="rolarAtributos()">🎲 Rolar Atributos</button>
                    <button class="btn-sec" onclick="limparFicha()">🗑️ Limpar</button>
                </div>
            </div>

            <div class="ficha-grid">
                <div class="ficha-col">
                    <div class="ficha-card">
                        <h3>Informações Básicas</h3>
                        <div class="form-group">
                            <label>Nome do Personagem</label>
                            <input type="text" id="charNome" placeholder="Digite o nome">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nível</label>
                                <input type="number" id="charNivel" value="1" min="1" max="20">
                            </div>
                            <div class="form-group">
                                <label>Classe</label>
                                <select id="charClasse">
                                    <option>Guerreiro</option>
                                    <option>Mago</option>
                                    <option>Ladino</option>
                                    <option>Clérigo</option>
                                    <option>Bárbaro</option>
                                    <option>Bardo</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Raça</label>
                            <select id="charRaca">
                                <option>Humano</option>
                                <option>Elfo</option>
                                <option>Anão</option>
                                <option>Halfling</option>
                                <option>Meio-Orc</option>
                                <option>Draconato</option>
                            </select>
                        </div>
                    </div>

                    <div class="ficha-card">
                        <h3>Atributos</h3>
                        <div id="atributosContainer" class="atributos-grid"></div>
                    </div>
                </div>

                <div class="ficha-col">
                    <div class="ficha-card">
                        <h3>Perícias</h3>
                        <div id="periciasContainer" class="pericias-grid"></div>
                    </div>

                    <div class="ficha-card">
                        <h3 onclick="toggleMagias()" style="cursor:pointer;">
                            🔮 Magias <span style="font-size:0.8rem;">▼</span>
                        </h3>
                        <div id="magiasContainer" style="display:none;"></div>
                    </div>

                    <div class="ficha-card">
                        <h3>📖 História</h3>
                        <textarea id="charHistoria" rows="4" placeholder="Escreva a história do personagem..."></textarea>
                    </div>
                </div>
            </div>

            <!-- DADOS -->
            <div class="dice-area">
                <div class="dice-buttons">
                    <button class="dice-btn" onclick="rolarDado(4)">d4</button>
                    <button class="dice-btn" onclick="rolarDado(6)">d6</button>
                    <button class="dice-btn" onclick="rolarDado(8)">d8</button>
                    <button class="dice-btn" onclick="rolarDado(10)">d10</button>
                    <button class="dice-btn" onclick="rolarDado(12)">d12</button>
                    <button class="dice-btn" onclick="rolarDado(20)">d20</button>
                </div>
                <div class="dice-result" id="diceResult">0</div>
                <div id="diceHistory"></div>
            </div>
        </div>
    </div>

    <!-- FOOTER (adicionar no final) -->
    <footer class="main-footer">
        <p>© 2026 TENEBRIS - Todos os direitos reservados</p>
    </footer>
</section>
