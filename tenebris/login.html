<div id="page-login">
    <div class="login-wrapper">
        <div class="login-box">
            <div class="login-logo">
                <span class="logo-icon">⚔️</span>
                <h1>TENEBRIS</h1>
                <p>Sistema de RPG</p>
            </div>
            
            <div class="login-form">
                <div class="input-group">
                    <label>👤 Usuário</label>
                    <input type="text" id="loginUser" placeholder="Digite seu usuário" value="admin">
                </div>
                <div class="input-group">
                    <label>🔒 Senha</label>
                    <input type="password" id="loginPass" placeholder="Digite sua senha" value="123">
                </div>
                <button class="btn-primary" onclick="login()">
                    ENTRAR →
                </button>
                <p class="login-hint">admin / 123</p>
            </div>
        </div>
    </div>
</div>
